# DSH Profile Bundle patch — auto-applied when installed via `dsh plugin add`.
- insert:
    - id: dsh-tool-project-memory
      name: dsh-tool-project-memory
      config:
        indexInjectMaxBytes: 4096
        recallMaxBytes: 32768
        rememberMaxBodyBytes: 16384
        maxDomains: 64
        readOnly: false
        writeDenyDomains: []
        writeAllowDomains: []
        writeDenyPresets: []
        writeAllowPresets: []
        writeApprovalDomains: []
        distillReminder: false
        distillReminderMaxBytes: 2048
        distillReminderMinTurn: 2
        distillCompactionReminder: false
        distillAssist: false
        distillAssistMaxBytes: 8192
        distillAuto: false
        distillAutoTrigger: compaction-end
        distillAutoMaxWrites: 3
        distillAutoLlm: false
        vectorEmbedModel: local-fhash-v1
        recallRanking: token
        vectorSidecar: false
        vectorDimensions: 256
