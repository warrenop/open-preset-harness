# Example: enable project memory in Harness (manual profile patch)
#
# Prefer Profile Bundle install instead:
#   dsh plugin --profile web add "github:warrenop/open-preset-harness#main&path:packages/tool-project-memory"
#
# If you patch manually, append to ~/.dsh/profiles/<profile>/cordis.patch.yml
# See docs/harness-integration.md for link + profile steps.

- insert:
    - id: dsh-tool-project-memory
      name: dsh-tool-project-memory
      config:
        indexInjectMaxBytes: 4096
        recallMaxBytes: 32768
        rememberMaxBodyBytes: 16384
        maxDomains: 64
        readOnly: false
        writeDenyDomains: []
