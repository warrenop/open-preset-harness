# Example: enable project memory in Harness
#
# Append to your profile cordis.patch.yml (~/.dsh/profiles/<profile>/cordis.patch.yml)
# Patch uses `insert` — id-only rows target existing entries; new plugins need insert.
#
# See docs/harness-integration.md for link + profile steps.
# See docs/phase-0-memory-api.md for tool API.

- insert:
    - id: dsh-tool-project-memory
      name: '@open-preset-harness/dsh-tool-project-memory/plugin'
      config:
        indexInjectMaxBytes: 4096
        recallMaxBytes: 32768
        rememberMaxBodyBytes: 16384
        maxDomains: 64
        readOnly: false
        writeDenyDomains: []
